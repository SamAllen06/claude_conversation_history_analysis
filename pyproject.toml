[project]
name = "cha"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "packaging>=24.1",
	"numpy>=1.26",
    "pandas>=2.2",
    "matplotlib",
    "cftime",
    "nc-time-axis",
    "xarray",
]

[project.optional-dependencies]
speed = [
    "scipy",
    "bottleneck",
    "numbagg",
]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
